<ul class="sidebar-nav list-group">
  {% if user.is_authenticated %}
    <li class="list-group-item">User: <a href="{{ user.get_absolute_url }}">{{ user.get_username }}</a></li>
    <li class="list-group-item"><a href="{% url 'logout' %}?next={{request.path}}">Log out</a></li>
  {% else %}
{#    <li class="list-group-item"><a href="{% url 'login' %}?next={{request.path}}">Log in</a></li>#}
    <form action="{% url 'logout' %}" method="post">
      {% csrf_token %} #csrf_token is very important to have as this is POST request
      <button type="submit">Logout</button>
    </form>
  {% endif %}

  <br>

  <li class="list-group-item"><a href="{% url 'agency:home' %}">Home</a></li>
  <li class="list-group-item"><a href="{% url 'agency:newspaper-list' %}">Newspapers</a></li>
  <li class="list-group-item"><a href="{% url 'agency:redactor-list' %}">Redactors</a></li>
  <li class="list-group-item"><a href="{% url 'agency:topic-list' %}">Topics</a></li>
</ul>
